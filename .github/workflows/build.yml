name: Build

# Reusable build pipeline for Expo apps. Call it from an app repository:
#
#   jobs:
#     build:
#       uses: lmiklosko/rn-workflows/.github/workflows/build.yml@main
#       with:
#         profile: production
#         platform: android
#       secrets:
#         ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
#         ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
#         ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
#         ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
#         IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
#         IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
#         IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
#         FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
#         GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
#         APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
#         APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
#         APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
#
# `rn-workflows init` writes this list for you. A delivery target whose secrets
# are missing is skipped with a warning; the build itself still succeeds.
#
# Secrets are read from the GitHub Environment named after the profile. They
# must be passed by name as above: `secrets: inherit` is ignored when the
# calling repository has a different owner (see docs/spikes.md).
#
# Every input is a string, and an empty string means "not set, use the config
# file". A boolean input would arrive as `false` when omitted and wrongly
# override a `true` in the config file.

on:
  workflow_call:
    inputs:
      profile:
        description: Build profile, which is also the GitHub Environment holding its secrets. Leave empty for an unsigned verification build.
        type: string
        default: ''
      platform:
        description: ios, android or all.
        type: string
        default: all
      signing:
        description: auto signs when a profile is given; none forces an unsigned build.
        type: string
        default: auto
      deliver:
        description: Comma-separated delivery targets (firebase, testflight, play), or none. Overrides the profile.
        type: string
        default: ''
      submit-for-review:
        description: true or false. Overrides the profile.
        type: string
        default: ''
      android-runner:
        description: Runner label, or a JSON array of labels, for the Android job.
        type: string
        default: ''
      ios-runner:
        description: Runner label, or a JSON array of labels, for the iOS job.
        type: string
        default: ''
      xcode-version:
        type: string
        default: ''
      node-version:
        type: string
        default: ''
      working-directory:
        description: Directory of the Expo app, relative to the repo root.
        type: string
        default: ''
      config-path:
        description: Path of the config file. Defaults to rn-workflows.json at the repo root, which is optional.
        type: string
        default: ''
      build-number-offset:
        description: Added to the run number to form the build number.
        type: string
        default: ''
      artifact-retention-days:
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      IOS_P12_BASE64:
        description: Signing certificate with its private key, as a base64-encoded .p12.
        required: false
      IOS_P12_PASSWORD:
        required: false
      IOS_MOBILEPROVISION_BASE64:
        description: Provisioning profile, base64-encoded. Its type decides the export method.
        required: false
      FIREBASE_SERVICE_ACCOUNT_BASE64:
        description: Service account key (JSON, base64) allowed to distribute through Firebase App Distribution.
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64:
        description: Service account key (JSON, base64) with release access to the app in Play Console.
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_BASE64:
        description: App Store Connect API key (.p8, base64), used to upload to TestFlight.
        required: false
      APP_ENV:
        description: dotenv content exported to the app's prebuild and build.
        required: false
    outputs:
      version:
        description: Marketing version of the app.
        value: ${{ jobs.resolve.outputs.version }}
      build-number:
        description: Build number stamped on every platform in this run.
        value: ${{ jobs.resolve.outputs.build-number }}
      android-artifact:
        description: Name of the run artifact holding the Android build, empty when Android was not built.
        value: ${{ jobs.android.outputs.artifact }}
      ios-artifact:
        description: Name of the run artifact holding the iOS build, empty when iOS was not built.
        value: ${{ jobs.ios.outputs.artifact }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve build plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      version: ${{ steps.plan.outputs.version }}
      build-number: ${{ steps.plan.outputs.build-number }}
      profile: ${{ steps.plan.outputs.profile }}
      environment: ${{ steps.plan.outputs.environment }}
      signing: ${{ steps.plan.outputs.signing }}
      working-directory: ${{ steps.plan.outputs.working-directory }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      android-runner: ${{ steps.plan.outputs.android-runner }}
      ios-runner: ${{ steps.plan.outputs.ios-runner }}
      android-gradle-tasks: ${{ steps.plan.outputs.android-gradle-tasks }}
      extra-artifact-paths: ${{ steps.plan.outputs.extra-artifact-paths }}
      artifact-retention-days: ${{ steps.plan.outputs.artifact-retention-days }}
      android-deliver: ${{ steps.plan.outputs.android-deliver }}
      ios-deliver: ${{ steps.plan.outputs.ios-deliver }}
      testflight-groups: ${{ steps.plan.outputs.testflight-groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rn-workflows
        uses: lmiklosko/rn-workflows/actions/cli@main

      - name: Resolve
        id: plan
        run: rn-workflows ci resolve
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_SIGNING: ${{ inputs.signing }}
          INPUT_DELIVER: ${{ inputs.deliver }}
          INPUT_SUBMIT_FOR_REVIEW: ${{ inputs.submit-for-review }}
          INPUT_ANDROID_RUNNER: ${{ inputs.android-runner }}
          INPUT_IOS_RUNNER: ${{ inputs.ios-runner }}
          INPUT_XCODE_VERSION: ${{ inputs.xcode-version }}
          INPUT_NODE_VERSION: ${{ inputs.node-version }}
          INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          INPUT_CONFIG_PATH: ${{ inputs.config-path }}
          INPUT_BUILD_NUMBER_OFFSET: ${{ inputs.build-number-offset }}
          INPUT_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}

  android:
    name: Android
    needs: resolve
    if: needs.resolve.outputs.android == 'true'
    runs-on: ${{ fromJSON(needs.resolve.outputs.android-runner) }}
    # Empty for an unsigned build, which then runs without any environment.
    environment: ${{ needs.resolve.outputs.environment }}
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    env:
      RNW_PLAN: ${{ needs.resolve.outputs.plan }}
      # Hooks run in both platform jobs; this tells them which one they are in.
      RNW_PLATFORM: android
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.working-directory }}
    steps:
      # A release build compiles native code for four ABIs and fills the ~14 GB
      # a standard hosted runner has free. Toolchains an Expo build never uses
      # are removed first, which frees roughly 20 GB more.
      - name: Free disk space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rn-workflows
        uses: lmiklosko/rn-workflows/actions/cli@main

      - name: Set up the workspace
        id: setup
        uses: lmiklosko/rn-workflows/actions/setup@main
        with:
          working-directory: ${{ needs.resolve.outputs.working-directory }}
          node-version: ${{ fromJSON(needs.resolve.outputs.plan).node }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Export build environment
        run: rn-workflows ci env
        env:
          RNW_VARS_JSON: ${{ toJSON(vars) }}
          RNW_APP_ENV: ${{ secrets.APP_ENV }}

      # Before prebuild, so app config plugins can read RNW_ANDROID_CERT_SHA256.
      - name: Install signing credentials
        if: needs.resolve.outputs.signing == 'true'
        run: rn-workflows ci android-credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Hook - before prebuild
        if: fromJSON(env.RNW_PLAN).hooks.prePrebuild
        run: bash -eo pipefail -c "$HOOK"
        env:
          HOOK: ${{ fromJSON(env.RNW_PLAN).hooks.prePrebuild }}

      # NODE_ENV is set for prebuild and Gradle only, never for the install.
      - name: Prebuild
        run: ${{ steps.setup.outputs.exec }} expo prebuild --platform android --clean --no-install
        env:
          NODE_ENV: production

      - name: Hook - after prebuild
        if: fromJSON(env.RNW_PLAN).hooks.postPrebuild
        run: bash -eo pipefail -c "$HOOK"
        env:
          HOOK: ${{ fromJSON(env.RNW_PLAN).hooks.postPrebuild }}

      - name: Set build number
        run: rn-workflows ci patch-android

      - name: Build
        working-directory: ${{ needs.resolve.outputs.working-directory }}/android
        run: |
          chmod +x gradlew
          ./gradlew $GRADLE_TASKS
        env:
          GRADLE_TASKS: ${{ needs.resolve.outputs.android-gradle-tasks }}
          NODE_ENV: production

      - name: Hook - after build
        if: fromJSON(env.RNW_PLAN).hooks.postBuild
        run: bash -eo pipefail -c "$HOOK"
        env:
          HOOK: ${{ fromJSON(env.RNW_PLAN).hooks.postBuild }}

      - name: Name the artifact
        id: artifact
        run: echo "name=android-${PROFILE:-unsigned}" >> "$GITHUB_OUTPUT"
        env:
          PROFILE: ${{ needs.resolve.outputs.signing == 'true' && needs.resolve.outputs.profile || '' }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ needs.resolve.outputs.working-directory }}/android/app/build/outputs/apk/**/*.apk
            ${{ needs.resolve.outputs.working-directory }}/android/app/build/outputs/bundle/**/*.aab
            ${{ needs.resolve.outputs.extra-artifact-paths }}
          if-no-files-found: error
          retention-days: ${{ needs.resolve.outputs.artifact-retention-days }}

      # After the artifact upload, so a failed delivery never costs the build.
      - name: Deliver
        if: needs.resolve.outputs.android-deliver == 'true'
        run: rn-workflows ci deliver-android
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}

      - name: Remove credentials
        if: always()
        run: rn-workflows ci cleanup || true

  ios:
    name: iOS
    needs: resolve
    if: needs.resolve.outputs.ios == 'true'
    runs-on: ${{ fromJSON(needs.resolve.outputs.ios-runner) }}
    environment: ${{ needs.resolve.outputs.environment }}
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
      testflight-uploaded: ${{ steps.deliver.outputs.testflight-uploaded }}
      bundle-id: ${{ steps.deliver.outputs.bundle-id }}
    env:
      RNW_PLAN: ${{ needs.resolve.outputs.plan }}
      RNW_PLATFORM: ios
      # Without it CocoaPods aborts with "Unicode Normalization not appropriate
      # for ASCII-8BIT".
      LANG: en_US.UTF-8
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rn-workflows
        uses: lmiklosko/rn-workflows/actions/cli@main

      - name: Set up the workspace
        id: setup
        uses: lmiklosko/rn-workflows/actions/setup@main
        with:
          working-directory: ${{ needs.resolve.outputs.working-directory }}
          node-version: ${{ fromJSON(needs.resolve.outputs.plan).node }}

      - name: Select Xcode
        env:
          XCODE: ${{ fromJSON(needs.resolve.outputs.plan).ios.xcode }}
        run: |
          if [ -n "$XCODE" ]; then
            APP="/Applications/Xcode_$XCODE.app"
            if [ ! -d "$APP" ]; then
              echo "::error::Xcode $XCODE is not installed on this runner. Available: $(ls /Applications | grep -i '^Xcode' | tr '\n' ' ')"
              exit 1
            fi
            sudo xcode-select -s "$APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Export build environment
        run: rn-workflows ci env
        env:
          RNW_VARS_JSON: ${{ toJSON(vars) }}
          RNW_APP_ENV: ${{ secrets.APP_ENV }}

      # Before prebuild, so app config plugins can read RNW_IOS_TEAM_ID and
      # RNW_IOS_PROFILE_PATH.
      - name: Install signing credentials
        if: needs.resolve.outputs.signing == 'true'
        run: rn-workflows ci ios-credentials
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}

      - name: Hook - before prebuild
        if: fromJSON(env.RNW_PLAN).hooks.prePrebuild
        run: bash -eo pipefail -c "$HOOK"
        env:
          HOOK: ${{ fromJSON(env.RNW_PLAN).hooks.prePrebuild }}

      - name: Prebuild
        run: ${{ steps.setup.outputs.exec }} expo prebuild --platform ios --clean --no-install
        env:
          NODE_ENV: production

      - name: Install pods
        working-directory: ${{ needs.resolve.outputs.working-directory }}/ios
        run: pod install
        env:
          NODE_ENV: production

      - name: Hook - after prebuild
        if: fromJSON(env.RNW_PLAN).hooks.postPrebuild
        run: bash -eo pipefail -c "$HOOK"
        env:
          HOOK: ${{ fromJSON(env.RNW_PLAN).hooks.postPrebuild }}

      # Also checks the app's entitlements against the profile, which xcodebuild
      # would only report at the end of the archive.
      - name: Set build number and signing
        run: rn-workflows ci patch-ios

      # Proves the app compiles and bundles. Release, so the JavaScript bundle
      # is built too; arm64 only, to compile once instead of twice.
      - name: Build for the simulator (unsigned)
        if: needs.resolve.outputs.signing != 'true'
        working-directory: ${{ needs.resolve.outputs.working-directory }}/ios
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pretty() { if command -v xcbeautify >/dev/null 2>&1; then xcbeautify --renderer github-actions; else cat; fi; }
          if [ -n "$RNW_IOS_WORKSPACE" ]; then CONTAINER=(-workspace "$RNW_IOS_WORKSPACE"); else CONTAINER=(-project "$RNW_IOS_PROJECT"); fi

          xcodebuild "${CONTAINER[@]}" \
            -scheme "$RNW_IOS_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/rnw-derived-data" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | pretty

          APP=$(find "$RUNNER_TEMP/rnw-derived-data/Build/Products" -maxdepth 2 -name '*.app' | head -n 1)
          [ -n "$APP" ] || { echo "::error::The build finished but produced no .app."; exit 1; }
          mkdir -p build/rnw
          ditto -c -k --keepParent "$APP" "build/rnw/$(basename "$APP" .app)-simulator.zip"

      - name: Archive and export (signed)
        if: needs.resolve.outputs.signing == 'true'
        working-directory: ${{ needs.resolve.outputs.working-directory }}/ios
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pretty() { if command -v xcbeautify >/dev/null 2>&1; then xcbeautify --renderer github-actions; else cat; fi; }
          if [ -n "$RNW_IOS_WORKSPACE" ]; then CONTAINER=(-workspace "$RNW_IOS_WORKSPACE"); else CONTAINER=(-project "$RNW_IOS_PROJECT"); fi

          xcodebuild "${CONTAINER[@]}" \
            -scheme "$RNW_IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/rnw-app.xcarchive" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | pretty

          rn-workflows ci ios-export-options --out "$RUNNER_TEMP/rnw-export-options.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/rnw-app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/rnw-export-options.plist" \
            -exportPath build/rnw 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log" | pretty

          ls build/rnw/*.ipa >/dev/null 2>&1 || { echo "::error::Export finished but produced no .ipa."; exit 1; }

      - name: Hook - after build
        if: fromJSON(env.RNW_PLAN).hooks.postBuild
        run: bash -eo pipefail -c "$HOOK"
        env:
          HOOK: ${{ fromJSON(env.RNW_PLAN).hooks.postBuild }}

      - name: Name the artifact
        id: artifact
        run: echo "name=ios-${PROFILE:-unsigned}" >> "$GITHUB_OUTPUT"
        env:
          PROFILE: ${{ needs.resolve.outputs.signing == 'true' && needs.resolve.outputs.profile || '' }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ needs.resolve.outputs.working-directory }}/ios/build/rnw/*.ipa
            ${{ needs.resolve.outputs.working-directory }}/ios/build/rnw/*.zip
            ${{ needs.resolve.outputs.extra-artifact-paths }}
          if-no-files-found: error
          retention-days: ${{ needs.resolve.outputs.artifact-retention-days }}

      # The formatted log above is abridged; the full one explains odd failures.
      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name || 'ios' }}-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      # After the artifact upload, so a failed delivery never costs the build.
      - name: Deliver
        id: deliver
        if: needs.resolve.outputs.ios-deliver == 'true'
        run: rn-workflows ci deliver-ios
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Remove credentials
        if: always()
        run: rn-workflows ci cleanup || true

  # Apple needs minutes to process an upload before it can be assigned to
  # testers. Waiting happens here, on a Linux runner, not on the macOS one.
  testflight-groups:
    name: TestFlight groups
    needs: [resolve, ios]
    if: needs.ios.outputs.testflight-uploaded == 'true' && needs.resolve.outputs.testflight-groups == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    timeout-minutes: 60
    steps:
      - name: Install rn-workflows
        uses: lmiklosko/rn-workflows/actions/cli@main

      - name: Add the build to its groups
        run: rn-workflows ci testflight-groups
        env:
          RNW_PLAN: ${{ needs.resolve.outputs.plan }}
          RNW_IOS_BUNDLE_ID: ${{ needs.ios.outputs.bundle-id }}
          RNW_VERSION: ${{ needs.resolve.outputs.version }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
