name: Spike - Environment secrets through a reusable workflow

# Question: when a repo under ANOTHER owner calls this public reusable workflow
# with `secrets: inherit`, and the job here names an environment, does the job
# see that environment's secrets and variables in the caller's repo?
#
# To run it, in a repo owned by someone other than this repo's owner:
#   1. Create an Environment named `rnw-spike` with
#        secret   RNW_SPIKE_SECRET = anything
#        variable RNW_SPIKE_VAR    = anything
#   2. Add this workflow and dispatch it:
#
#        name: rn-workflows spike
#        on: workflow_dispatch
#        jobs:
#          inherit:
#            uses: lmiklosko/rn-workflows/.github/workflows/spike-secrets.yml@main
#            with:
#              environment: rnw-spike
#            secrets: inherit
#          no-inherit:
#            uses: lmiklosko/rn-workflows/.github/workflows/spike-secrets.yml@main
#            with:
#              environment: rnw-spike
#
# The second job shows whether `inherit` is needed at all for environment secrets.
#
# Temporary: delete once the answer is recorded.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # Reports presence and names only. Values never leave the env block.
      - name: Report what this job can see
        env:
          SPIKE_SECRET: ${{ secrets.RNW_SPIKE_SECRET }}
          SPIKE_VAR: ${{ vars.RNW_SPIKE_VAR }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          present() { [ -n "$1" ] && echo "yes" || echo "NO"; }
          {
            echo "### Environment secrets via reusable workflow"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Caller | \`$GITHUB_REPOSITORY\` |"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| Environment secret visible | $(present "$SPIKE_SECRET") |"
            echo "| Environment variable visible | $(present "$SPIKE_VAR") |"
            echo "| Secret names in context | $(echo "$SECRETS_JSON" | jq -r 'keys | join(", ")') |"
            echo "| Variable names in context | $(echo "$VARS_JSON" | jq -r 'keys | join(", ")') |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
