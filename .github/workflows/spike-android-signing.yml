name: Spike - Android injected signing

# Question: does passing AGP's injected signing properties on the Gradle command
# line sign an Expo-generated release build with our keystore, with no edit to
# android/app/build.gradle? The template wires the release build type to the
# debug keystore, so the answer is only yes if the injected one wins.
#
# Temporary: delete once the answer is recorded and the real build action exists.

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create a fresh Expo app
        run: |
          npx --yes create-expo-app@latest app --template blank --yes
          cd app
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("app.json", "utf8"));
            c.expo.android = { ...(c.expo.android || {}), package: "com.example.rnwspike" };
            fs.writeFileSync("app.json", JSON.stringify(c, null, 2));
          '
          node -p '"expo " + require("expo/package.json").version + ", react-native " + require("react-native/package.json").version'

      - name: Prebuild
        working-directory: app
        run: npx expo prebuild --platform android --clean
        env:
          NODE_ENV: production

      - name: Show what the template does about signing
        working-directory: app/android
        run: grep -n -i -B2 -A8 'signingConfig' app/build.gradle || true

      # A throwaway key that exists only for this run, so nothing here is secret.
      - name: Generate a throwaway keystore
        run: |
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/spike.keystore" \
            -alias spike -keyalg RSA -keysize 2048 -validity 1 \
            -storepass spikepass -keypass spikepass \
            -dname "CN=rn-workflows spike"

      - name: Build release APK and AAB with injected signing
        working-directory: app/android
        env:
          NODE_ENV: production
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/spike.keystore" \
            -Pandroid.injected.signing.store.password=spikepass \
            -Pandroid.injected.signing.key.alias=spike \
            -Pandroid.injected.signing.key.password=spikepass

      - name: Compare signing certificates
        working-directory: app/android
        run: |
          normalise() { tr -d ': \n' | tr 'A-F' 'a-f'; }

          EXPECTED=$(keytool -list -v -keystore "$RUNNER_TEMP/spike.keystore" -storepass spikepass \
            | grep 'SHA256:' | head -n 1 | sed 's/.*SHA256://' | normalise)

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)

          "$APKSIGNER" verify --print-certs "$APK"
          APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep 'certificate SHA-256 digest:' | head -n 1 | sed 's/.*digest://' | normalise)
          AAB_SHA=$(keytool -printcert -jarfile "$AAB" \
            | grep 'SHA256:' | head -n 1 | sed 's/.*SHA256://' | normalise)

          {
            echo "### Android injected signing"
            echo ""
            echo "| | SHA-256 |"
            echo "|---|---|"
            echo "| Keystore | \`$EXPECTED\` |"
            echo "| APK | \`$APK_SHA\` |"
            echo "| AAB | \`$AAB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          [ "$APK_SHA" = "$EXPECTED" ] || { echo "::error::APK is not signed with the injected keystore."; FAILED=1; }
          [ "$AAB_SHA" = "$EXPECTED" ] || { echo "::error::AAB is not signed with the injected keystore."; FAILED=1; }
          [ "$FAILED" = 0 ] && echo "APK and AAB are both signed with the injected keystore."
          exit "$FAILED"
