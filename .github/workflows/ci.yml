name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Schema is up to date
        run: |
          npm run schema
          git diff --exit-code schema/

  # Input-only use: no config file, no profile, no secrets.
  android-unsigned:
    name: e2e Android unsigned
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      platform: android
      working-directory: example

  # Signed with a throwaway keystore held in this repo's `e2e` Environment.
  android-signed:
    name: e2e Android signed
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      profile: e2e
      platform: android
      config-path: example/rn-workflows.json
      build-number-offset: '1000'
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APP_ENV: ${{ secrets.APP_ENV }}

  verify-android-signed:
    name: e2e Android signed - verify
    needs: android-signed
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android-signed.outputs.android-artifact }}
          path: build

      - name: Check signer and build number
        env:
          EXPECTED_SHA: ${{ vars.ANDROID_CERT_SHA256 }}
          EXPECTED_BUILD: ${{ needs.android-signed.outputs.build-number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          normalise() { tr -d ': \n' | tr 'A-F' 'a-f'; }
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          APK=$(find build -name '*.apk' | head -n 1)
          AAB=$(find build -name '*.aab' | head -n 1)
          [ -n "$APK" ] || { echo "::error::No APK in the artifact."; exit 1; }
          [ -n "$AAB" ] || { echo "::error::No AAB in the artifact."; exit 1; }

          APK_SHA=$("$TOOLS/apksigner" verify --print-certs "$APK" \
            | grep 'certificate SHA-256 digest:' | head -n 1 | sed 's/.*digest://' | normalise)
          AAB_SHA=$(keytool -printcert -jarfile "$AAB" \
            | grep 'SHA256:' | head -n 1 | sed 's/.*SHA256://' | normalise)
          VERSION_CODE=$("$TOOLS/aapt2" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)

          echo "expected signer $EXPECTED_SHA"
          echo "apk signer      $APK_SHA"
          echo "aab signer      $AAB_SHA"
          echo "versionCode     $VERSION_CODE (expected $EXPECTED_BUILD = run $RUN_NUMBER + 1000)"

          FAILED=0
          [ -n "$EXPECTED_SHA" ] || { echo "::error::ANDROID_CERT_SHA256 variable is not set in the e2e Environment."; FAILED=1; }
          [ "$APK_SHA" = "$EXPECTED_SHA" ] || { echo "::error::APK is not signed with the e2e keystore."; FAILED=1; }
          [ "$AAB_SHA" = "$EXPECTED_SHA" ] || { echo "::error::AAB is not signed with the e2e keystore."; FAILED=1; }
          [ "$VERSION_CODE" = "$EXPECTED_BUILD" ] || { echo "::error::versionCode is $VERSION_CODE, expected $EXPECTED_BUILD."; FAILED=1; }
          [ "$EXPECTED_BUILD" = "$((RUN_NUMBER + 1000))" ] || { echo "::error::build-number output is $EXPECTED_BUILD, expected $((RUN_NUMBER + 1000))."; FAILED=1; }
          exit "$FAILED"
