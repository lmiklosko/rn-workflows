name: Spike - Environment secrets control (same repo)

# Control for spike-secrets.yml: the same call, but caller and reusable workflow
# share an owner. Temporary.

on:
  workflow_dispatch:

jobs:
  inherit:
    uses: ./.github/workflows/spike-secrets.yml
    with:
      environment: rnw-spike
    secrets: inherit
  no-inherit:
    uses: ./.github/workflows/spike-secrets.yml
    with:
      environment: rnw-spike
